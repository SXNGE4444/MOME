name: Website checks

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Check static site paths, accessible controls and disclosures
        run: python3 scripts/check-website.py
